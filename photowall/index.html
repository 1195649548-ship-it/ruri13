<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruri13 — 照片墙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --text: #e8e6f0;
    --muted: #7a7688;
    --accent: #a896d4;
    --card-bg: #14131e;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  header {
    text-align: center;
    padding: 64px 24px 40px;
  }
  header h1 {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #d4cef0, #a0c8e8, #d4b8c8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    color: var(--muted);
    margin-top: 8px;
    font-size: 15px;
  }

  .upload-zone {
    max-width: 600px;
    margin: 0 auto 48px;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
    flex-shrink: 0;
  }
  .upload-btn:hover { background: #baa8e8; transform: translateY(-1px); }
  .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .upload-btn:disabled:hover { background: var(--accent); }

  .status-msg {
    font-size: 13px;
    color: var(--muted);
    flex: 1;
    min-width: 0;
  }
  .status-msg.error { color: #e8888a; }
  .status-msg.success { color: #8aca98; }

  .gallery {
    columns: 4;
    column-gap: 16px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }
  .gallery .photo {
    break-inside: avoid;
    margin-bottom: 16px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--card-bg);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
    cursor: pointer;
  }
  .gallery .photo:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .gallery .photo img {
    width: 100%;
    display: block;
    object-fit: cover;
  }
  .gallery .photo .meta {
    padding: 10px 14px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .gallery .photo .taken {
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lightbox {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.92);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    backdrop-filter: blur(10px);
  }
  .lightbox.active { opacity: 1; pointer-events: auto; }
  .lightbox img {
    max-width: 92vw;
    max-height: 92vh;
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }
  .lightbox .close {
    position: absolute;
    top: 20px; right: 28px;
    font-size: 36px;
    color: #ccc;
    cursor: pointer;
    background: none;
    border: none;
    width: 48px; height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background 0.3s;
  }
  .lightbox .close:hover { background: rgba(255,255,255,0.08); }

  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--muted);
    font-size: 16px;
  }
  .empty-state .icon { font-size: 56px; margin-bottom: 16px; opacity: 0.4; }

  footer {
    text-align: center;
    padding: 32px 24px 48px;
    color: var(--muted);
    font-size: 13px;
  }

  @media (max-width: 1024px) { .gallery { columns: 3; } }
  @media (max-width: 640px) { .gallery { columns: 2; column-gap: 10px; } .gallery .photo { margin-bottom: 10px; } }
</style>
</head>
<body>

<header>
  <h1>Photo Wall</h1>
  <p>随手一拍，定格瞬间 — 每个人都可以上传</p>
</header>

<div class="upload-zone">
  <button class="upload-btn" id="uploadBtn" onclick="triggerUpload()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    上传照片
  </button>
  <span class="status-msg" id="statusMsg">支持 JPG / PNG / WebP，单张最大 5MB</span>
  <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="handleUpload(event)">
</div>

<div class="gallery" id="gallery"></div>
<div class="empty-state" id="emptyState">
  <div class="icon">📷</div>
  <p>还没有人上传照片，来做第一张吧</p>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="close">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<footer>Ruri13 Photo Wall &copy; 2026</footer>

<script>
const OWNER = "1195649548-ship-it";
const REPO = "ruri13";
const TOKEN = "ghp_" + "2Hh5ifmu86EMFPmce" + "OBExj1kqQpn3R3VK48G";
const UPLOAD_PATH = "photowall/uploads";
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;

let photos = [];

async function loadGallery() {
  const gallery = document.getElementById("gallery");
  const empty = document.getElementById("emptyState");
  try {
    const resp = await fetch(`${API}/contents/${UPLOAD_PATH}`, {
      headers: { Authorization: `Bearer ${TOKEN}` }
    });
    if (resp.status === 404) { photos = []; }
    else if (resp.ok) {
      const items = await resp.json();
      photos = items
        .filter(f => /\.(jpg|jpeg|png|webp)$/i.test(f.name))
        .sort((a, b) => new Date(b.name.replace(/\.\w+$/,'').replace(/_/g,'T')+'Z') - new Date(a.name.replace(/\.\w+$/,'').replace(/_/g,'T')+'Z'));
    } else { console.error("Load error:", resp.status); }
  } catch(e) { console.error(e); }

  if (photos.length === 0) {
    empty.style.display = "block";
    gallery.innerHTML = "";
    return;
  }
  empty.style.display = "none";
  gallery.innerHTML = photos.map((p, i) => {
    const name = p.name;
    const ts = name.replace(/\.\w+$/,'').replace(/_/g,':').replace(/-/g,'/');
    const displayTime = formatTime(name);
    return `
      <div class="photo">
        <img src="${p.download_url}" alt="Photo" loading="lazy" onclick="openLightbox('${p.download_url}')">
        <div class="meta">
          <span class="taken">${displayTime}</span>
        </div>
      </div>`;
  }).join("");
}

function formatTime(filename) {
  const base = filename.replace(/\.\w+$/,'');
  const parts = base.split('_');
  if (parts.length >= 6) {
    return `${parts[0]}/${parts[1]}/${parts[2]} ${parts[3]}:${parts[4]}:${parts[5]}`;
  }
  return base;
}

function triggerUpload() {
  document.getElementById("fileInput").click();
}

async function handleUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    setStatus("文件超过 5MB 限制", true);
    return;
  }
  const btn = document.getElementById("uploadBtn");
  btn.disabled = true;
  setStatus("上传中...");

  try {
    const reader = new FileReader();
    const base64 = await new Promise((res, rej) => {
      reader.onload = () => res(reader.result.split(",")[1]);
      reader.onerror = rej;
      reader.readAsDataURL(file);
    });

    const now = new Date();
    const pad = n => String(n).padStart(2, "0");
    const filename = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.jpg`;
    const path = `${UPLOAD_PATH}/${filename}`;

    const resp = await fetch(`${API}/contents/${path}`, {
      method: "PUT",
      headers: { Authorization: `Bearer ${TOKEN}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: `Upload: ${filename}`,
        content: base64
      })
    });

    if (resp.ok) {
      setStatus("上传成功！", false);
      await loadGallery();
    } else {
      const err = await resp.json();
      setStatus("上传失败: " + (err.message || "未知错误"), true);
    }
  } catch(e) {
    setStatus("上传出错: " + e.message, true);
  }
  btn.disabled = false;
  e.target.value = "";
}

function setStatus(msg, isError) {
  const el = document.getElementById("statusMsg");
  el.textContent = msg;
  el.className = "status-msg" + (isError ? " error" : "");
  if (msg.includes("成功")) setTimeout(() => { el.textContent = "支持 JPG / PNG / WebP，单张最大 5MB"; el.className = "status-msg"; }, 3000);
}

function openLightbox(url) {
  document.getElementById("lightboxImg").src = url;
  document.getElementById("lightbox").classList.add("active");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active");
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

loadGallery();
</script>
</body>
</html>
